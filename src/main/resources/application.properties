spring.application.name=ws

# Local defaults keep a fresh checkout runnable. Production values should be
# supplied as environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cmss}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate owns the development schema for now. Replace with Flyway/Liquibase
# migrations before the first production release.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Authentication secrets are mandatory and have no source-controlled fallback.
app.security.jwt.issuer=${JWT_ISSUER:cms-api}
app.security.jwt.audience=${JWT_AUDIENCE:cms-spa}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT5M}
app.security.jwt.private-key=${JWT_PRIVATE_KEY:}
app.security.jwt.public-key=${JWT_PUBLIC_KEY:}
app.security.refresh-token-ttl=${REFRESH_TOKEN_TTL:P30D}
app.security.refresh-cookie-name=${REFRESH_COOKIE_NAME:cms_refresh}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Field-level student phone protection. Production values must come from a
# secrets manager or environment injection and be independently rotated.
app.security.student-data.active-key-version=${STUDENT_DATA_KEY_VERSION:1}
app.security.student-data.encryption-key=${STUDENT_DATA_ENCRYPTION_KEY:}
app.security.student-data.lookup-key=${STUDENT_DATA_LOOKUP_KEY:}
 
 